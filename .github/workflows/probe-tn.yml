name: Probe tn.gov reachability (throwaway diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and inspect TDFI enforcement-actions page structure
        run: |
          python3 -c "
          import urllib.request, re
          url = 'https://www.tn.gov/tdfi/enforcement-actions.html'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          html = urllib.request.urlopen(req, timeout=20).read().decode('utf-8', 'ignore')
          print('LENGTH', len(html))
          print('--- first 4000 chars ---')
          print(html[:4000])
          print('--- links matching enforcement ---')
          for m in re.finditer(r'href=\"([^\"]*enforcement[^\"]*)\"', html, re.I):
              print(m.group(1))
          "
